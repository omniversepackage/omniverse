org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Which brands/<name>/brand.json to build. Override with -Pomniverse.brand=<name>.
omniverse.brand=omniverse
# Compile Kotlin inside each Gradle build: Claude and Qwen build concurrently, and a shared
# Kotlin daemon got into a broken state (android.* "Cannot access class"/unresolved errors).
kotlin.compiler.execution.strategy=in-process
# No persistent Gradle daemon: a daemon inherits the caller's stdout pipe, which made the Qwen
# agent's shell tool wait forever after Gradle had finished.
org.gradle.daemon=false
